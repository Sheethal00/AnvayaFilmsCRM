# --- user roles / UI-only tab visibility (SPEC.md §4) -------------------
# CLAUDE.md caveat: this hides sheet tabs by Windows username
# (Environ("Username")). It is NOT real access control — do not describe
# it to users as securing financial data.
user_role_permissions:
  columns: [Username, Role, SheetAccess]
  roles:
    Admin:
      visible_sheets: all
    Manager:
      visible_sheets: ["01", "02", "03", "04", "05", "06", "07", "12", "13", "14", "15", "16", "17", "18"]
      notes: "No Settings edit"
    Editor:
      visible_sheets: ["09", "10", "11"]
      notes: "Production only"
    Sales:
      visible_sheets: ["01", "02", "03", "04"]
      notes: "01 limited view; no Finance"
    Accountant:
      visible_sheets: ["12", "13", "14", "15", "16", "17", "18"]
      notes: "No CRM/Production"
