# 03a_Quotation_LineItems — sub-table of 03_Quotation_Manager (SPEC.md §3)
# One quote -> many priced lines (e.g. Album + Highlight Film + Drone
# itemized separately, rather than one lump PackageValue).
sheet: "03a_Quotation_LineItems"
type: table
parent_sheet: "03_Quotation_Manager"

columns:
  - name: QuoteID
    type: text
    foreign_key: {sheet: "03_Quotation_Manager", column: QuoteID}

  - name: ItemDescription
    type: dropdown
    list_ref: ItemCatalog
    notes: >
      Values come from 19_Settings.item_catalog. Picking one auto-suggests
      UnitPrice from the catalog (vba/modules/ItemCatalog.bas), but only
      when UnitPrice is still blank — never overwrites a custom price.

  - name: Qty
    type: num

  - name: UnitPrice
    type: currency
    notes: "Auto-suggested once from the catalog price, then freely editable — not a locked formula (see ItemDescription notes)."

  - name: LineTotal
    type: formula
    formula: "Qty * UnitPrice"
